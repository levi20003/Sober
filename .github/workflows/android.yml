name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Minden futás nagyobb verziókódot kap, így az új APK frissítésként települ a régire.
      # (100 + sorszám: a telefonon már lévő 6-os verziónál mindenképp nagyobb.)
      - name: Verziókód
        run: echo "ANDROID_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - run: npm ci
      # Supply chain (biztonsági audit 1.4): magas vagy kritikus sérülékenység esetén a build megáll.
      - run: npm audit --audit-level=high
      - run: npm test
      # Segélyvonalak: 90 napnál régebbi ellenőrzésnél ::warning:: (docs/SAFETY.md 4.1)
      - run: node scripts/check-helplines.mjs
      # A verziókód a buildbe is bekerül: az app ezzel veti össze a legfrissebb kiadást (frissítésfigyelő).
      - run: npm run build
      # A kiszállított bundle-ben csak react, react-dom, scheduler és a saját kód lehet.
      - run: npm run check:bundle
      # Csak az APK kap hálózati engedélyt, és csak a GitHub kiadási API-ra (lásd scripts/android-csp.mjs).
      - run: node scripts/android-csp.mjs
      - run: npx cap sync android

      - name: Aláírókulcs előkészítése (ha van)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_KIND=release" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            # A main ágról kiadás készül: debug kulccsal aláírt APK nem települne frissítésként a felhasználók
            # telefonján lévő app fölé (az adataik elérhetetlenné válnának). Ilyenkor a build megáll.
            echo "::error::Nincs ANDROID_KEYSTORE_BASE64 titok a main ágon. Kiadás csak a kiadási kulccsal készülhet (docs/DEPLOYMENT.md)."
            exit 1
          else
            echo "SIGNING_KIND=debug" >> "$GITHUB_ENV"
            echo "::warning::Nincs ANDROID_KEYSTORE_BASE64 titok: az APK ideiglenes debug kulccsal készül, amely minden futásnál más. Az ilyen APK nem települ a korábbi build fölé."
          fi

      - name: APK fordítása
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Az APK-nak érvényes v2 aláírással kell rendelkeznie (Android 7+ ezt követeli meg),
      # és kiírjuk az aláíró tanúsítvány ujjlenyomatát: két build között akkor egyezik,
      # ha a frissítés telepíthető.
      - name: Aláírás ellenőrzése
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          FP=$(grep -m1 "certificate SHA-256 digest" verify.txt | sed 's/.*: //')
          echo "CERT_SHA256=$FP" >> "$GITHUB_ENV"
          # A kiadási kulcs ujjlenyomata rögzítve van (android/signing-fingerprint.txt): más kulcs = megállunk.
          EXPECTED=$(grep -E '^[0-9a-f]{64}$' android/signing-fingerprint.txt)
          if [ "$SIGNING_KIND" = "release" ] && [ "$FP" != "$EXPECTED" ]; then
            echo "::error::Az APK aláíró tanúsítványa ($FP) nem egyezik a rögzített kiadási ujjlenyomattal ($EXPECTED)."
            exit 1
          fi
          echo "::notice title=Aláíró tanúsítvány ($SIGNING_KIND kulcs)::SHA-256: $FP, verziókód: $ANDROID_VERSION_CODE"

      - name: APK átnevezése és ellenőrzőösszeg
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk jozansag-szamlalo.apk
          sha256sum jozansag-szamlalo.apk | tee jozansag-szamlalo.apk.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jozansag-szamlalo-apk
          path: |
            jozansag-szamlalo.apk
            jozansag-szamlalo.apk.sha256

      # A main ágon mindig ugyanazon a címen érhető el a legfrissebb APK:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/jozansag-szamlalo.apk
      - name: Kiadás frissítése (android-latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNING_KIND" = "release" ]; then
            SIGN_NOTE="állandó kiadási kulcs: az új verziók az előzőre frissítésként települnek"
          else
            SIGN_NOTE="IDEIGLENES debug kulcs: ez a build nem települ egy korábbi build fölé, előbb távolítsd el a régit (az adatai elvesznek)"
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Telepíthető APK a main ág $GITHUB_SHA állapotából.

          A Józanság-számláló segít követni és támogatni a józanságod útját. Nem orvosi eszköz, és nem helyettesíti a szakember segítségét.
          Ha közvetlen veszélyben vagy, hívd a 112-t.

          - Verziókód: $ANDROID_VERSION_CODE
          - Aláírás: $SIGN_NOTE
          - Aláíró tanúsítvány SHA-256: \`$CERT_SHA256\`
          - Ellenőrzőösszeg: jozansag-szamlalo.apk.sha256
          - Telepítési útmutató: https://levi20003.github.io/Sober/telepites.html
          NOTES
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest jozansag-szamlalo.apk jozansag-szamlalo.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Józanság-számláló Android (legfrissebb)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease

  # Valódi telepítés és indítás emulátoron: az APK-t telepítjük, elindítjuk, és a valódi
  # WebView-t a Chrome DevTools protokollal végigvezetjük a használati folyamaton
  # (PIN, idővonal, krízisoverlay, 116-123 tárcsázás, újraindítás repülőgép-módban).
  # A WebView-hibakeresés CSAK ebben a próbabuildben van bekapcsolva; a kiadott APK-ban nem.
  emulator-smoke:
    name: Emulátoros próba (valódi WebView)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: node scripts/android-csp.mjs
      - name: WebView-hibakeresés bekapcsolása (csak a próbabuildben)
        run: |
          jq '.android.webContentsDebuggingEnabled = true' capacitor.config.json > "$RUNNER_TEMP/cap.json"
          mv "$RUNNER_TEMP/cap.json" capacitor.config.json
      - run: npx cap sync android
      # Két build ugyanazzal a (futáson belüli) debug kulccsal, különböző verziókóddal:
      # a második az elsőre frissítésként települ. A harmadik APK más kulccsal van aláírva,
      # annak a telepítésnek el kell utasulnia.
      - name: Próba-APK-k fordítása (1001 és 1002 verziókód)
        working-directory: android
        run: |
          mkdir -p ../smoke-in
          ANDROID_VERSION_CODE=1001 ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../smoke-in/v1001.apk
          ANDROID_VERSION_CODE=1002 ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../smoke-in/v1002.apk
      - name: Más kulccsal aláírt APK előállítása
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/idegen.jks" -alias idegen -keyalg RSA -keysize 2048 -validity 30 \
            -storepass idegenjelszo -keypass idegenjelszo -dname "CN=Idegen kulcs"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/idegen.jks" --ks-pass pass:idegenjelszo --key-pass pass:idegenjelszo \
            --out smoke-in/foreign.apk smoke-in/v1002.apk
      # Frissítés a KIADOTT verzióról (M12): a jelenlegi android-latest APK fölé az új buildnek frissítésként
      # kell települnie. Ehhez az új próba-APK-t a kiadási kulccsal is aláírjuk (a kulcs a futás végén törlődik).
      - name: Kiadott APK letöltése és az új build aláírása a kiadási kulccsal
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "::error::Nincs kiadási kulcs a main ágon"; exit 1; fi
            echo "::warning::Nincs kiadási kulcs (pl. fork PR): a kiadott verzióról történő frissítés próbája kimarad."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            --out smoke-in/release-new.apk smoke-in/v1002.apk
          rm -f "$RUNNER_TEMP/release.jks"
          gh release download android-latest --repo "$GITHUB_REPOSITORY" --pattern jozansag-szamlalo.apk --output smoke-in/release-old.apk
          echo "SMOKE_RELEASE_ARGS=--release-old smoke-in/release-old.apk --release-new smoke-in/release-new.apk" >> "$GITHUB_ENV"
      - name: KVM engedélyezése
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A v2.37.0 kiadás commitjára rögzítve (nem mozgó címke).
      - name: Emulátor indítása és smoke teszt
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: node scripts/android-smoke.mjs smoke-in/v1001.apk smoke-out --upgrade smoke-in/v1002.apk --foreign smoke-in/foreign.apk --old-vault tests/fixtures/vault-format1-schema1.json $SMOKE_RELEASE_ARGS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-smoke
          path: smoke-out
          if-no-files-found: ignore
